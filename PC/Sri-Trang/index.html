<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบจำนวนนักกีฬาคณะศรีตรัง</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
        }
        
        .trang-bg { background-color: #5c2d91; }
        .trang-text { color: #5c2d91; }
        .trang-border { border-color: #5c2d91; }

        .spin-anim { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ========================================================
           การตั้งค่าสำหรับการสั่งพิมพ์ (Print CSS)
           ======================================================== */
        @media print {
            body { 
                background-color: white !important; 
                margin: 0 !important;
                padding: 0 !important;
                color: black !important;
            }
            
            body > *:not(#print-area) { display: none !important; }
            
            #print-area { 
                display: block !important; 
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
            }

            .print-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 15px; 
                font-size: 14pt;
                page-break-inside: auto; 
            }
            .print-table tr {
                page-break-inside: avoid; 
                page-break-after: auto;
            }
            .print-table th, .print-table td {
                border: 1px solid #000 !important;
                padding: 10px 8px;
                text-align: left;
            }
            .print-table th {
                background-color: #f3e8ff !important; 
                color: #5c2d91 !important;
                font-weight: bold;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact;
            }
            
            .print-header {
                font-size: 26pt !important;
                font-weight: bold !important;
                text-align: center;
                margin-bottom: 20px;
                border-bottom: 3px solid #5c2d91;
                padding-bottom: 10px;
                color: #5c2d91 !important;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact;
            }

            .page-container {
                display: block; 
                width: 100%;
                padding-top: 1.5cm !important; 
                padding-left: 1cm;
                padding-right: 1cm;
                padding-bottom: 1cm;
            }
            
            .force-page-break {
                page-break-before: always;
                break-before: page;
            }

            .signature-section {
                margin-top: 50px;
                page-break-inside: avoid;
            }
        }

        .config-table th { background-color: #f3e8ff; color: #5c2d91; padding: 12px 8px; text-align: left; border: 1px solid #e5e7eb; }
        .config-table td { padding: 10px 8px; border: 1px solid #e5e7eb; }
        .config-table tr:hover { background-color: #f9fafb; }
    </style>
</head>

                </div>

                    <span class="material-symbols-outlined">print</span>

    </div>

        function getFormattedDate() {
            const date = new Date();
            const hh = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');
            const ss = String(date.getSeconds()).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const yy = String(date.getFullYear()).slice(-2);
            return `${hh} : ${mm} : ${ss} - ${dd} / ${month} / ${yy}`;
        }

        const API_URL = "https://script.google.com/macros/s/AKfycbyYcyfX0znWZJaf1Tp6SQxV5XEkGJqKO7-s4G5dLjIbw0VD-PeVWb9wLD2VC1F0PpN3/exec"; 
        
        let globalSheetDetails = {};
        
        let currentSinglePrintConfig = null;

        function fetchData() {
            document.getElementById('loading-state').classList.remove('hidden');
            document.getElementById('dashboard-container').classList.add('hidden');
            const btnIcon = document.getElementById('refresh-icon');
            btnIcon.classList.add('spin-anim');
            document.getElementById('loading-text').innerHTML = 'กำลังเชื่อมต่อและดึงข้อมูลจากชีต...';

            fetch(API_URL)
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then(apiData => {
                    renderDashboard(apiData.counts);
                    globalSheetDetails = apiData.details;
                    
                    const updatedTime = getFormattedDate();
                    document.getElementById('last-updated-text').textContent = `อัปเดต : ${updatedTime}`;
                    
                    document.getElementById('loading-state').classList.add('hidden');
                    document.getElementById('dashboard-container').classList.remove('hidden');
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                    document.getElementById('loading-text').innerHTML = `
                        <span class="text-red-500 font-bold block mb-2">เกิดข้อผิดพลาดในการดึงข้อมูล</span>
                        กรุณาตรวจสอบลิงก์ API หรือการเชื่อมต่ออินเทอร์เน็ต<br>
                        <span class="text-sm font-normal">รายละเอียด: ${error.message}</span>
                    `;
                })
                .finally(() => {
                    btnIcon.classList.remove('spin-anim');
                });
        }


        // =================================================================
        // ระบบพิมพ์เดี่ยว (เปิดหน้าตั้งค่า)
        // =================================================================
        function openSinglePrintConfig(sportName, catName, levelName, sheetIndex) {
            const modal = document.getElementById('print-modal');
            const configContent = document.getElementById('modal-config-content');
            
            currentSinglePrintConfig = { sportName, catName, levelName, sheetIndex };

            let displayCatName = catName;
            if(catName === "Free Fire") displayCatName = ""; 
            const titleText = `${sportName} ${displayCatName} ${levelName}`;
            
            document.getElementById('modal-title').innerHTML = `ตั้งค่าเอกสาร: <span class="text-purple-300">${titleText}</span>`;

            const sheetData = globalSheetDetails[sheetIndex];
            
            const skipColIndex = sheetData && sheetData.headers ? sheetData.headers.findIndex(h => h.includes('ชื่อเล่น')) : -1;

            if (!sheetData || !sheetData.rows || sheetData.rows.length === 0) {
                configContent.innerHTML = `<div class="text-center text-gray-500 py-10 text-lg">ไม่มีข้อมูลรายชื่อผู้สมัครให้เลือกพิมพ์</div>`;
            } else {
                let configTopHTML = `
                    <div class="mb-5 bg-white p-5 rounded-lg border border-gray-200 shadow-sm">
                        <h3 class="font-bold text-gray-800 mb-3 flex items-center gap-2">
                            <span class="material-symbols-outlined text-purple-600">edit_document</span> 
                            ระบุนักเรียนผู้รับผิดชอบ (จะแสดงท้ายเอกสาร)
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">คนที่ 1</label>
                                <input type="text" id="resp-student-1" class="w-full border border-gray-300 p-2 rounded-md outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500" placeholder="พิมพ์ชื่อ-สกุล (ปล่อยว่างได้)">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">คนที่ 2</label>
                                <input type="text" id="resp-student-2" class="w-full border border-gray-300 p-2 rounded-md outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500" placeholder="พิมพ์ชื่อ-สกุล (ปล่อยว่างได้)">
                            </div>
                        </div>
                    </div>
                `;

                let tableHTML = `
                    <div class="mb-3 text-sm text-gray-600 flex items-start gap-2">
                        <span class="material-symbols-outlined text-purple-500 text-lg">info</span>
                        <p>ติ๊กเลือกคนที่จะพิมพ์ และกำหนดสถานะ (คนที่ไม่ได้ติ๊กและคอลัมน์ <b>"ชื่อเล่น"</b> จะถูกซ่อนอัตโนมัติ)</p>
                    </div>
                    <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm bg-white">
                        <table class="config-table w-full text-sm whitespace-nowrap">
                            <thead>
                                <tr>
                                    <th class="w-10 text-center">
                                        <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)" class="w-4 h-4 cursor-pointer accent-purple-600">
                                    </th>
                                    <th class="w-16 text-center">ลำดับ</th>
                `;
                
                sheetData.headers.forEach((header, idx) => {
                    if (idx !== skipColIndex) {
                        tableHTML += `<th>${header}</th>`;
                    }
                });
                
                tableHTML += `<th class="w-32 text-center bg-purple-100 border-l-2 border-purple-300">ระบุสถานะ</th></tr></thead><tbody id="configTableBody">`;
                
                sheetData.rows.forEach((row, rowIndex) => {
                    tableHTML += `<tr class="print-row-config">`;
                    tableHTML += `<td class="text-center"><input type="checkbox" class="row-checkbox w-4 h-4 cursor-pointer accent-purple-600"></td>`;
                    tableHTML += `<td class="text-center text-gray-500">${rowIndex + 1}</td>`;
                    
                    row.forEach((cell, idx) => {
                        if (idx !== skipColIndex) {
                            const cellData = (cell === null || cell === undefined) ? "" : cell;
                            tableHTML += `<td>${cellData}</td>`;
                        }
                    });
                    
                    tableHTML += `
                        <td class="text-center border-l-2 border-purple-100">
                            <select class="row-status border border-gray-300 rounded p-1.5 outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 text-sm w-full bg-white">
                                <option value="">เลือกสถานะ...</option>
                                <option value="ตัวจริง">ตัวจริง</option>
                                <option value="ตัวสำรอง">ตัวสำรอง</option>
                            </select>
                        </td>
                    `;
                    tableHTML += `</tr>`;
                });
                
                tableHTML += `</tbody></table></div>`;
                
                configContent.innerHTML = configTopHTML + tableHTML;
            }

            modal.classList.remove('hidden');
        }

        function toggleSelectAll(selectAllCheckbox) {
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = selectAllCheckbox.checked;
            });
        }

        function closeModal() {
            document.getElementById('print-modal').classList.add('hidden');
            currentSinglePrintConfig = null;
        }


        // =================================================================
        // ระบบพิมพ์เดี่ยว (ยืนยันและสร้างหน้ากระดาษ)
        // =================================================================
        function confirmSinglePrint() {
            if(!currentSinglePrintConfig) return;

            const { sportName, catName, levelName, sheetIndex } = currentSinglePrintConfig;
            const sheetData = globalSheetDetails[sheetIndex];
            const skipColIndex = sheetData.headers.findIndex(h => h.includes('ชื่อเล่น'));
            
            // อ่านค่าคนรับผิดชอบ
            let std1Input = document.getElementById('resp-student-1')?.value.trim();
            let std2Input = document.getElementById('resp-student-2')?.value.trim();
            
            // ถัาไม่ได้พิมพ์อะไร ให้ใช้เส้นประ ถ้าพิมพ์มาให้ใช้ชื่อนั้นแทนเลยทั้ง 2 จุด
            let std1 = std1Input ? std1Input : "...................................................................";
            let std2 = std2Input ? std2Input : "...................................................................";

            const configRows = document.querySelectorAll('.print-row-config');
            let selectedData = [];
            
            configRows.forEach((tr, index) => {
                const isChecked = tr.querySelector('.row-checkbox').checked;
                if(isChecked) {
                    const statusVal = tr.querySelector('.row-status').value;
                    selectedData.push({
                        originalRow: sheetData.rows[index],
                        status: statusVal
                    });
                }
            });

            if(selectedData.length === 0) {
                alert("กรุณาติ๊กเลือกรายชื่ออย่างน้อย 1 คนเพื่อพิมพ์ครับ");
                return;
            }

            const statusOrder = { "ตัวจริง": 1, "ตัวสำรอง": 2, "": 3 };
            selectedData.sort((a, b) => statusOrder[a.status] - statusOrder[b.status]);

            let displayCatName = catName;
            if(catName === "Free Fire") displayCatName = ""; 
            const titleText = `${sportName} ${displayCatName} ${levelName}`;
            
            let tableHTML = `<table class="print-table w-full text-left mb-8">`;
            tableHTML += `<thead><tr>`;
            tableHTML += `<th class="w-12 text-center border-b-2 border-purple-300">ลำดับ</th>`;
            
            sheetData.headers.forEach((header, idx) => {
                if(idx !== skipColIndex) tableHTML += `<th class="border-b-2 border-purple-300">${header}</th>`;
            });
            
            tableHTML += `<th class="border-b-2 border-purple-300 text-center w-24">สถานะ</th>`;
            tableHTML += `</tr></thead><tbody>`;
            
            selectedData.forEach((item, index) => {
                tableHTML += `<tr>`;
                tableHTML += `<td class="text-center">${index + 1}</td>`;
                item.originalRow.forEach((cell, idx) => {
                    if (idx !== skipColIndex) {
                        const cellData = (cell === null || cell === undefined) ? "" : cell;
                        tableHTML += `<td>${cellData}</td>`;
                    }
                });
                tableHTML += `<td class="text-center font-bold">${item.status}</td>`;
                tableHTML += `</tr>`;
            });
            tableHTML += `</tbody></table>`;

            // ส่วนลายเซ็น ใช้ตัวแปร std1 และ std2 ทั้งบนบรรทัดและในวงเล็บ
            const signatureHTML = `
                <div class="signature-section mt-12 mb-8">
                    <p class="font-bold text-center text-lg mb-8">นักเรียนผู้รับผิดชอบ</p>
                    <div class="flex justify-around w-full max-w-4xl mx-auto">
                        <div class="text-center">
                            <p class="mb-3">ลงชื่อ ${std1}</p>
                            <p>(${std1})</p>
                        </div>
                        <div class="text-center">
                            <p class="mb-3">ลงชื่อ ${std2}</p>
                            <p>(${std2})</p>
                        </div>
                    </div>
                </div>
            `;

            const fullContentHTML = `
                <div class="page-container" style="padding-top: 1cm; padding-left: 1cm; padding-right: 1cm; padding-bottom: 1cm;">
                    <div class="print-header trang-text font-bold text-center text-2xl mb-6 pb-2 border-b-2 border-purple-900">
                        ${titleText}
                    </div>
                    ${tableHTML}
                    ${signatureHTML}
                </div>
            `;

            document.getElementById('print-area').innerHTML = fullContentHTML;
            closeModal();

            setTimeout(() => {
                window.print();
            }, 300);
        }


        // =================================================================
        // ระบบพิมพ์ทั้งหมด
        // =================================================================
        function generateBasicTableHTML(sportName, catName, levelName, sheetIndex, isFirstElement = false) {
            const sheetData = globalSheetDetails[sheetIndex];
            
            let displayCatName = catName;
            if(catName === "Free Fire") displayCatName = ""; 
            const titleText = `${sportName} ${displayCatName} ${levelName}`;
            
            let tableHTML = '';
            
            if (!sheetData || !sheetData.rows || sheetData.rows.length === 0) {
                tableHTML = `<div class="text-center text-gray-500 py-6 text-lg border border-dashed border-gray-300 bg-gray-50 mb-10">ยังไม่มีผู้สมัครในรายการนี้</div>`;
            } else {
                const skipColIndex = sheetData.headers.findIndex(h => h.includes('ชื่อเล่น'));

                tableHTML = `<table class="print-table w-full text-left mb-10">`;
                tableHTML += `<thead><tr>`;
                tableHTML += `<th class="w-12 text-center border-b-2 border-purple-300">ลำดับ</th>`;
                sheetData.headers.forEach((header, idx) => {
                    if (idx !== skipColIndex) tableHTML += `<th class="border-b-2 border-purple-300">${header}</th>`;
                });
                tableHTML += `</tr></thead><tbody>`;
                
                sheetData.rows.forEach((row, rowIndex) => {
                    tableHTML += `<tr>`;
                    tableHTML += `<td class="text-center">${rowIndex + 1}</td>`;
                    row.forEach((cell, idx) => {
                        if (idx !== skipColIndex) {
                            const cellData = (cell === null || cell === undefined) ? "" : cell;
                            tableHTML += `<td>${cellData}</td>`;
                        }
                    });
                    tableHTML += `</tr>`;
                });
                tableHTML += `</tbody></table>`;
            }
            
            const breakClass = isFirstElement ? '' : 'force-page-break';
            const displayStyle = isFirstElement ? 'padding-top: 1cm; padding-left: 1cm; padding-right: 1cm; padding-bottom: 1cm;' : '';

            return `
                <div class="page-container ${breakClass}" style="${displayStyle}">
                    <div class="print-header trang-text font-bold text-center text-2xl mb-6 pb-2 border-b-2 border-purple-900">
                        ${titleText}
                    </div>
                    ${tableHTML}
                </div>
            `;
        }

        function executePrintAll() {
            if(Object.keys(globalSheetDetails).length === 0) {
                alert("กรุณารอโหลดข้อมูลให้เสร็จก่อนสั่งพิมพ์ทั้งหมดครับ");
                return;
            }

            document.getElementById('print-loading-overlay').classList.remove('hidden');
            document.getElementById('print-loading-overlay').classList.add('flex');

            setTimeout(() => {
                let allHTML = '';
                let isFirst = true;

                SPORTS_CONFIG.forEach(sport => {
                    sport.categories.forEach(category => {
                        category.levels.forEach(level => {
                            allHTML += generateBasicTableHTML(sport.name, category.name, level.name, level.sheetIndex, isFirst);
                            isFirst = false; 
                        });
                    });
                });

                document.getElementById('print-area').innerHTML = allHTML;
                
                document.getElementById('print-loading-overlay').classList.add('hidden');
                document.getElementById('print-loading-overlay').classList.remove('flex');
                
                setTimeout(() => {
                    window.print();
                }, 100);
                
            }, 300);
        }

        // =================================================================
        // สร้าง Dashboard
        // =================================================================
        function renderDashboard(apiCountsData) {
            const container = document.getElementById('dashboard-container');
            let htmlContent = '';

            SPORTS_CONFIG.forEach(sport => {
                htmlContent += `
                    <div class="card-container bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 print-break-inside-avoid">
                        <div class="trang-bg text-white px-4 py-3 flex items-center gap-2">
                            <span class="material-symbols-outlined">${sport.icon}</span>
                            <h2 class="text-lg font-bold">${sport.name}</h2>
                        </div>
                        <div class="p-4 space-y-5">
                `;

                sport.categories.forEach(category => {
                    let iconHTML = '';
                    if (category.name === 'Free Fire' || category.name.includes('ชาย - หญิง') || category.name.includes('คู่ผสม')) {
                        iconHTML = `<span class="material-symbols-outlined trang-text text-[16px]">wc</span>`;
                    } else if (category.name === 'ชายคู่') {
                        iconHTML = `<div class="flex items-center"><span class="material-symbols-outlined trang-text text-[16px]">man</span><span class="material-symbols-outlined trang-text text-[16px] -ml-1">man</span></div>`;
                    } else if (category.name === 'หญิงคู่') {
                        iconHTML = `<div class="flex items-center"><span class="material-symbols-outlined trang-text text-[16px]">woman</span><span class="material-symbols-outlined trang-text text-[16px] -ml-1">woman</span></div>`;
                    } else if (category.name.includes('ชาย')) {
                        iconHTML = `<span class="material-symbols-outlined trang-text text-[16px]">man</span>`;
                    } else if (category.name.includes('หญิง')) {
                        iconHTML = `<span class="material-symbols-outlined trang-text text-[16px]">woman</span>`;
                    } else {
                        iconHTML = `<span class="material-symbols-outlined trang-text text-[16px]">group</span>`;
                    }
                    
                    htmlContent += `
                        <div class="space-y-3">
                            <div class="flex items-center gap-2 border-b pb-1">
                                ${iconHTML}
                                <h3 class="font-semibold text-gray-800">${category.name}</h3>
                            </div>
                            <div class="space-y-3 pl-2">
                    `;

                    category.levels.forEach(level => {
                        const maxTotal = level.real + level.sub;
                        const registered = apiCountsData[level.sheetIndex] || 0;
                        
                        let realContainerWidth = (level.real / maxTotal) * 100;
                        let subContainerWidth = level.sub > 0 ? (level.sub / maxTotal) * 100 : 0;
                        
                        let realFill = 0;
                        let subFill = 0;
                        let currentReal = 0;
                        let currentSub = 0;

                        if (registered <= level.real) {
                            realFill = (registered / level.real) * 100;
                            subFill = 0;
                            currentReal = registered;
                            currentSub = 0;
                        } else {
                            realFill = 100; 
                            currentReal = level.real;
                            currentSub = registered - level.real;
                            if (level.sub > 0) {
                                subFill = Math.min(((registered - level.real) / level.sub) * 100, 100);
                            }
                        }

                        let realColorClass = currentReal >= level.real ? "trang-text" : "text-red-500";

                        htmlContent += `
                            <div class="space-y-1 relative level-row">
                                <div class="flex justify-between items-center gap-2">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="font-medium text-gray-700 text-sm">${level.name}</span>
                                        <button onclick="openSinglePrintConfig('${sport.name}', '${category.name}', '${level.name}', ${level.sheetIndex})" class="bg-purple-50 hover:bg-purple-100 text-purple-700 rounded px-2 py-0.5 text-[11px] flex items-center gap-1 cursor-pointer font-medium transition-colors border border-purple-100 shadow-sm">
                                            <span class="material-symbols-outlined text-[13px]">print</span> พิมพ์
                                        </button>
                                    </div>
                                    <div class="text-right text-[11px] sm:text-xs">
                                        <span class="${realColorClass} font-bold">ตัวจริง ${currentReal} / ${level.real}</span>
                                        ${level.sub > 0 ? `<span class="text-gray-300 mx-1">|</span><span class="text-gray-500">สำรอง ${currentSub} / ${level.sub}</span>` : ''}
                                    </div>
                                </div>
                                
                                <div class="w-full flex gap-1 h-2.5 items-center mt-1.5">
                                    <div class="bg-gray-200 rounded-full h-full flex overflow-hidden" style="width: ${realContainerWidth}%" title="ตัวจริง">
                                        <div class="h-full bg-purple-600 transition-all duration-500" style="width: ${realFill}%"></div>
                                    </div>
                                    
                                    ${level.sub > 0 ? `
                                    <div class="bg-gray-200 rounded-full h-full flex overflow-hidden" style="width: ${subContainerWidth}%" title="สำรอง">
                                        <div class="h-full bg-gray-400 transition-all duration-500" style="width: ${subFill}%"></div>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>
                        `;
                    });

                    htmlContent += `
                            </div>
                        </div>
                    `;
                });

                htmlContent += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
        }

        window.onload = () => {
            fetchData();
        };

    </script>
</body>
